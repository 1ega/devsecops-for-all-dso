name: Validate original kit content
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_smoke:
        description: Run the isolated Linux Falco syscall smoke test
        type: boolean
        default: false
concurrency:
  group: kit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install -r tools/validation/requirements.txt
      - run: python3 tools/validation/check_repo.py
      - run: python3 tools/roadmap/sync.py --check
      - run: python3 -m unittest discover -s tools/roadmap/tests -v
      - run: node --check public/app.js && node --check public/data.js
      - run: python3 -m yamllint .
      - run: python3 -m unittest discover -s tools/dso/tests -v
      - run: python3 -m pip install --require-hashes -r mcp/dso/requirements.lock
      - run: python3 -m unittest discover -s mcp/dso/tests -v
      - name: Compile Falco rules
        run: bash rules/falco/validate.sh
  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated positive and negative cases
        run: bash rules/falco/tests/smoke.sh

  dso-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --require-hashes -r mcp/dso/requirements.lock
      - name: Host CLI with pinned scanner containers (the CI gate path)
        run: python3 tools/dso/tests/smoke.py --engine docker
      - run: docker build -f mcp/dso/Dockerfile -t dso-mcp:test .
      - name: Real scanner detection and fixed-fixture acceptance
        run: |
          # The image ships no tests; mount the checked-out smoke test read-only.
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g \
            --mount "type=bind,src=$PWD/tools/dso/tests,dst=/opt/dso/tools/dso/tests,readonly" \
            --entrypoint python dso-mcp:test /opt/dso/tools/dso/tests/smoke.py --engine native
      - name: Container MCP stdio acceptance
        env:
          DSO_TEST_IMAGE: dso-mcp:test
        run: python3 -m unittest discover -s mcp/dso/tests -v
