name: Validate original kit content
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_smoke:
        description: Run the isolated Linux Falco syscall smoke test
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install -r tools/validation/requirements.txt
      - run: python3 tools/validation/check_repo.py
      - run: python3 tools/roadmap/sync.py --check
      - run: python3 -m unittest discover -s tools/roadmap/tests -v
      - run: node --check public/app.js && node --check public/data.js
      - run: python3 -m yamllint .
      - run: python3 -m unittest discover -s tools/dso/tests -v
      - name: Compile Falco rules
        run: bash rules/falco/validate.sh
  runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated positive and negative cases
        run: bash rules/falco/tests/smoke.sh
