name: Semgrep rule tests

on:
  push:
    paths:
      - "rules/semgrep/python/**"
      - ".github/workflows/rules.yml"
  pull_request:
    paths:
      - "rules/semgrep/python/**"
      - ".github/workflows/rules.yml"

permissions:
  contents: read

jobs:
  test-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install semgrep==1.175.0
      - name: Test rules
        run: semgrep test rules/semgrep/python/
