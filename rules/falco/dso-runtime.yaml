    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Ptrace succeeded in container
  desc: A successful ptrace call occurred in a container.
  condition: evt.type=ptrace and evt.rawres >= 0 and dso_container
  output: DSO Ptrace succeeded in container (rule_id=runtime.local.ptrace process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: WARNING
