- rule: DSO SSH authorized keys modified
  desc: A host or container opened an SSH authorized_keys file for writing.
  condition: dso_open_write and fd.name endswith /.ssh/authorized_keys
  output: DSO SSH authorized keys modified (rule_id=runtime.local.ssh-persistence process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fd.name
  priority: ERROR
  source: syscall
  tags:
  - dso
  - runtime
  - T1098
  - ssh-persistence
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Scheduler or systemd configuration modified
  desc: A host or container opened cron or systemd persistence configuration for writing.
  condition: dso_open_write and (fd.name=/etc/crontab or fd.name startswith /etc/cron.d/ or fd.name startswith /var/spool/cron/ or fd.name startswith /etc/systemd/system/)
  output: DSO Scheduler or systemd configuration modified (rule_id=runtime.local.scheduler-persistence process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fd.name
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1053
