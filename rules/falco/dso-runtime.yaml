  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Account credential database modified
  desc: A host or container opened a local account database for writing.
  condition: dso_open_write and fd.name in (/etc/passwd, /etc/shadow, /etc/group, /etc/gshadow)
  output: DSO Account credential database modified (rule_id=runtime.local.credential-write process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fd.name
  priority: ERROR
  source: syscall
  tags:
  - dso
  - runtime
  - T1098
