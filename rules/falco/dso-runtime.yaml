  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Security log removed
  desc: A named security log was successfully unlinked on a host or in a container.
  condition: evt.type in (unlink, unlinkat) and evt.rawres >= 0 and (fs.path.name=/var/log/auth.log or fs.path.name=/var/log/secure or fs.path.name startswith /var/log/audit/)
  output: DSO Security log removed (rule_id=runtime.local.log-removal process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fs.path.name
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1070
  - log-removal
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
