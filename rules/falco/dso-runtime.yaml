    comps:
    - '='
    - '='
    values: []
- rule: DSO Memory backed executable in container
  desc: A container executed an anonymous memory-backed file.
  condition: dso_exec and dso_container and proc.is_exe_from_memfd=true
  output: DSO Memory backed executable in container (rule_id=runtime.local.memfd-executable process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: ERROR
