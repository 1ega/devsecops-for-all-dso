# Original DSO syscall rules; MIT. Load after the pinned upstream rules.
# Falco 0.45.0. No upstream macros or plugin-specific fields are required.
- macro: dso_container
  condition: container.id != host and container.id != ""
- macro: dso_exec
  condition: evt.type in (execve, execveat) and evt.rawres >= 0
- macro: dso_open_read
  condition: evt.type in (open, openat, openat2) and evt.is_open_read=true and evt.rawres >= 0
- macro: dso_open_write
  condition: evt.type in (open, openat, openat2) and evt.is_open_write=true and evt.rawres >= 0
- list: dso_shells
  items:
  - sh
  - bash
  - dash
  - ash
  - zsh
  - ksh
  - fish
- list: dso_web_processes
  items:
  - nginx
  - apache2
  - httpd
  - php-fpm
  - php-fpm8.2
  - php-fpm8.3
  - gunicorn
  - uwsgi
- list: dso_package_managers
  items:
  - apt
  - apt-get
  - apk
  - yum
  - dnf
  - rpm
  - dpkg
  - pip
  - pip3
  - npm
  - yarn
  - pnpm
  - gem
- list: dso_discovery_tools
  items:
  - nmap
  - masscan
  - tcpdump
  - tshark
  - socat
- list: dso_credential_files
  items:
  - /etc/shadow
  - /etc/gshadow
  - /root/.aws/credentials
  - /root/.kube/config
- list: dso_runtime_sockets
  items:
  - /var/run/docker.sock
  - /run/docker.sock
  - /run/containerd/containerd.sock
  - /run/crio/crio.sock
  - /run/k3s/containerd/containerd.sock
- rule: DSO Interactive shell in container
  desc: Interactive shell execution in a container; correlate with approved troubleshooting and exec audit events.
  condition: dso_exec and dso_container and proc.name in (dso_shells) and proc.tty != 0
  output: DSO Interactive shell in container (rule_id=runtime.local.interactive-shell process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1059
  - interactive-shell
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Web process spawned shell
  desc: A named web server process directly spawned a shell in a container.
  condition: dso_exec and dso_container and proc.name in (dso_shells) and proc.pname in (dso_web_processes)
  output: DSO Web process spawned shell (rule_id=runtime.local.web-shell process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: ERROR
  source: syscall
  tags:
  - dso
  - runtime
  - T1059
  - web-shell
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Credential file read in container
  desc: A container opened a named credential file for reading; no file contents are logged.
  condition: dso_open_read and dso_container and fd.name in (dso_credential_files)
  output: DSO Credential file read in container (rule_id=runtime.local.credential-read process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fd.name
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1552
  - credential-read
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Service account token read by utility
  desc: A command-line file utility opened a Kubernetes service-account token path.
  condition: dso_open_read and dso_container and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/ and fd.name endswith /token and proc.name in (cat, head, tail, less, more, cp)
  output: DSO Service account token read by utility (rule_id=runtime.local.service-account-token process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fd.name
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1552
  - service-account-token
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Container accessed runtime socket
  desc: A container successfully accessed a named container runtime socket.
  condition: dso_container and evt.type in (connect, open, openat, openat2) and evt.rawres >= 0 and fd.name in (dso_runtime_sockets)
  output: DSO Container accessed runtime socket (rule_id=runtime.local.runtime-socket process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type) path=%fd.name
  priority: ERROR
  source: syscall
  tags:
  - dso
  - runtime
  - T1611
  - runtime-socket
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Executable launched from temporary directory
  desc: An executable was launched from a temporary directory in a container.
  condition: dso_exec and dso_container and (proc.exepath startswith /tmp/ or proc.exepath startswith /var/tmp/ or proc.exepath startswith /dev/shm/)
  output: DSO Executable launched from temporary directory (rule_id=runtime.local.temporary-executable process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1059
  - temporary-executable
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Package manager in running container
  desc: A package manager started in a running container; review mutable deployments.
  condition: dso_exec and dso_container and proc.name in (dso_package_managers)
  output: DSO Package manager in running container (rule_id=runtime.local.package-manager process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: NOTICE
  source: syscall
  tags:
  - dso
  - runtime
  - T1105
  - package-manager
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Network discovery utility in container
  desc: A named reconnaissance or packet-capture utility started in a container.
  condition: dso_exec and dso_container and proc.name in (dso_discovery_tools)
  output: DSO Network discovery utility in container (rule_id=runtime.local.network-discovery process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: WARNING
  source: syscall
  tags:
  - dso
  - runtime
  - T1046
  - network-discovery
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Known miner process name in container
  desc: A process with a common mining-tool name started in a container.
  condition: dso_exec and dso_container and proc.name in (xmrig, minerd, cpuminer, ethminer)
  output: DSO Known miner process name in container (rule_id=runtime.local.miner-name process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
  priority: ERROR
  source: syscall
  tags:
  - dso
  - runtime
  - T1496
  - miner-name
  exceptions:
  - name: approved_process
    fields:
    - proc.exepath
    - proc.pname
    comps:
    - '='
    - '='
    values: []
- rule: DSO Privilege helper in container
  desc: A privilege-switching utility started in a container; actual privilege gain is not established.
  condition: dso_exec and dso_container and proc.name in (sudo, su, doas, newgrp)
  output: DSO Privilege helper in container (rule_id=runtime.local.privilege-helper process=%proc.name executable=%proc.exepath parent=%proc.pname user=%user.name uid=%user.uid pid=%proc.pid container_id=%container.id event=%evt.type)
