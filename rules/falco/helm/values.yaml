---
# Falco chart 9.2.0 / Falco 0.45.0; add rules with --set-file (see README).
image:
  tag: 0.45.0@sha256:788f1129c542171813083d4afc61b16730a47dde8c23d9c39370acef996349b6
driver:
  kind: modern_ebpf
  modernEbpf:
    leastPrivileged: true
collectors:
  containerEngine:
    pluginRef: ghcr.io/falcosecurity/plugins/plugin/container:0.7.4@sha256:42f154787c862863e9ad9ac99b91c58116500b3bc2ff84f0d50175e825c4b4a0
  kubernetes:
    enabled: false
falcoctl:
  artifact:
    follow:
      enabled: false
  config:
    artifact:
      install:
        refs:
          - ghcr.io/falcosecurity/rules/falco-rules:5.2.0@sha256:213c9bb201088fa23e7fe51e595ce52292ff55fa7a4d43b2628287f92b1d66d0
metrics:
  enabled: true
  interval: 1m
  outputRule: false
falco:
  rule_matching: all
  json_output: true
  json_include_output_property: true
  priority: notice
  stdout_output:
    enabled: true
  syslog_output:
    enabled: false
  webserver:
    prometheus_metrics_enabled: true
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1024Mi
falcosidekick:
  enabled: false
responseActions:
  enabled: false
