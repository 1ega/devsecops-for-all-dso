rules:
  - id: MSTG-CODE-8_2
    severity: WARNING
    languages:
      - java
    metadata:
      source: https://github.com/mindedsecurity/semgrep-rules-android-security
      license: GPL-3.0
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      owasp-mobile: M7
      category: security
      area: code
      verification-level:
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      technology: [android]
    message: The application defines the attribute "$V" statically preventing the garbage collector from cleaning the memory.
    patterns:
      - pattern-not-inside: $M(...){...}
      - pattern: static $T $V;
      - metavariable-regex:
          metavariable: $T
          regex: .*(View|Activity|Context).*
