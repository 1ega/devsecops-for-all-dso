rules:
  - id: MSTG-CODE-8_3
    severity: WARNING
    languages:
      - java
    metadata:
      source: https://github.com/mindedsecurity/semgrep-rules-android-security
      license: GPL-3.0
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      owasp-mobile: M7
      category: security
      area: code
      verification-level:
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
      confidence: LOW
      likelihood: LOW
      impact: LOW
      technology: [android]
    message: The application uses dangerously inner classes that are prone to memory leak.
    pattern-either:
# Removed for performance reasons
#      - patterns:
#          - pattern: |
#              class $C{
#                static $INNER $X;
#                ...
#                $M(...){
#                  ...
#                  $X = new $INNER(...);
#                  ...
#                }
#                ...
#                class $INNER{...}
#                ...
#              }
#          - focus-metavariable:
#              - $INNER
      - patterns:
          - pattern: |
              class $C{
                ...
                class $INNER{
                  ...
                  $F(...,$A $P, ...){...}
                  ...
                }
                ...
              }
          - metavariable-regex:
              metavariable: $A
              regex: .*Activity
          - focus-metavariable:
              - $INNER
