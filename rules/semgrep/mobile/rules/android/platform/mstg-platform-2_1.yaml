rules:
  - id: MSTG-PLATFORM-2_1
    severity: WARNING
    languages:
      - java
    metadata:
      source: https://github.com/mindedsecurity/semgrep-rules-android-security
      license: GPL-3.0
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      owasp-mobile: M7
      category: security
      area: platform
      verification-level:
        - L1
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-injection-flaws-mstg-platform-2
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      technology: [android]
    message: The regular expression $RE is potentially vulnerable to catastrophic backtracking.
    options:
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $RE
              - pattern-regex: \"\^.*\$\"
          - pattern: Pattern.compile($RE, ...)
          - pattern: Pattern.matches($RE, ...)
          - pattern: $X.matches($RE)
      - focus-metavariable:
          - $RE
      - metavariable-analysis:
          analyzer: redos
          metavariable: $RE
