rules:
  - id: MSTG-STORAGE-8
    severity: WARNING
    languages:
      - xml
    metadata:
      source: https://github.com/mindedsecurity/semgrep-rules-android-security
      license: GPL-3.0
      authors:
        - Michele Di @cyberaz0r (IMQ Minded Security)
      owasp-mobile: M1
      category: security
      area: storage
      verification-level:
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05d-Testing-Data-Storage.md#testing-backups-for-sensitive-data-mstg-storage-8
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [android]
    message: The application allows automatic backup.
    paths:
      include:
        - "**/AndroidManifest.xml"
    patterns:
      - pattern: <application ... />
      - pattern-not: <application ... android:allowBackup="false" ... />
