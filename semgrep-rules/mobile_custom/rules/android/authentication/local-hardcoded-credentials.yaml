rules:
  - id: android.local.webview-hardcoded-http-auth
    languages: [java, kotlin]
    severity: ERROR
    message: >-
      WebView HTTP authentication uses hardcoded credentials. Obtain credentials from an
      authenticated flow or protected credential store instead.
    metadata:
      license: GPL-3.0
      category: security
      confidence: HIGH
      cwe: CWE-798
      technology: [android]
    pattern: $HANDLER.proceed("...", "...")
  - id: android.local.jdbc-hardcoded-credentials
    languages: [java, kotlin]
    severity: ERROR
    message: >-
      JDBC connection is opened with hardcoded credentials. Retrieve database credentials from a
      protected secret provider and do not ship them in a mobile application.
    metadata:
      license: GPL-3.0
      category: security
      confidence: HIGH
      cwe: CWE-798
      technology: [android, jdbc]
    pattern: DriverManager.getConnection($URL, "...", "...")
