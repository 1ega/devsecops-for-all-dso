rules:
  - id: MSTG-CODE-8_1
    severity: WARNING
    languages:
      - java
    metadata:
      source: https://github.com/mindedsecurity/semgrep-rules-android-security
      license: GPL-3.0
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      owasp-mobile: M7
      category: security
      area: code
      verification-level:
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      technology: [android]
    message: The application does not unregister the broadcast receiver "$RCV" in the "onStop()" method of the activity.
    options:
      symbolic_propagation: true
    patterns:
      - pattern: |
          public class $CLASS{
            ...
            $M(...){
              ...
              registerReceiver($RCV, ...);
              ...
            }
          }
      - pattern-not: |
          public class $CLASS{
            ...
            onStop(...){
              ...
              unregisterReceiver(...);
              ...
            }
          }
      - focus-metavariable:
          - $RCV
